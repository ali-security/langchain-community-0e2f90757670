# Primary CI workflow.
#
# Only runs against packages that have changed files.
#
# Runs:
# - Linting (_lint.yml)
# - Unit Tests (_test.yml)
# - Pydantic compatibility tests (_test_pydantic.yml)
# - Integration test compilation checks (_compile_integration_test.yml)
#
# Reports status to GitHub checks and PR status.

name: "🔧 CI"

on:
  workflow_dispatch:

# Optimizes CI performance by canceling redundant workflow runs
# If another push to the same PR or branch happens while this workflow is still running,
# cancel the earlier run in favor of the next run.
#
# There's no point in testing an outdated version of the code. GitHub only allows
# a limited number of job runners to be active at the same time, so it's better to
# cancel pointless jobs early so that more useful jobs can run sooner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "true"
  UV_NO_SYNC: "true"

jobs:
  # This job analyzes which files changed and creates a dynamic test matrix
  # to only run tests/lints for the affected packages, improving CI efficiency
  build:
    name: "Detect Changes & Set Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@v6
      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: "🔍 Analyze Changed Files & Generate Build Matrix"
        id: set-matrix
        # The changed-files action does not support workflow_dispatch on the fork,
        # so we feed the package path so every libs/community suite runs.
        run: |
          python .github/scripts/check_diff.py libs/community/pyproject.toml >> $GITHUB_OUTPUT
    outputs:
      dirs-to-lint: ${{ steps.set-matrix.outputs.dirs-to-lint }}
      dirs-to-test: ${{ steps.set-matrix.outputs.dirs-to-test }}
      extended-tests: ${{ steps.set-matrix.outputs.extended-tests }}
      test-pydantic: ${{ steps.set-matrix.outputs.test-pydantic }}
  lint:
    name: cd ${{ matrix.working-directory }}
    needs: [build]
    # Lint gate is not a test; disabled on the fork.
    if: false
    strategy:
      matrix:
        working-directory: ${{ fromJson(needs.build.outputs.dirs-to-lint) }}
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: ${{ matrix.working-directory }}
      python-version: "3.11"
    secrets: inherit

  # Run unit tests only on packages that have changed files
  # Inlined from _test.yml: the fork dispatcher requires timeout-minutes, which reusable-workflow callers cannot set.
  test:
    name: cd ${{ matrix.working-directory }}
    needs: [build]
    if: ${{ needs.build.outputs.dirs-to-test != '[]' }}
    strategy:
      matrix:
        working-directory: ${{ fromJson(needs.build.outputs.dirs-to-test) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@v6

      - name: "🐍 Set up Python 3.11 + UV"
        uses: "./.github/actions/uv_setup"
        id: setup-python
        with:
          python-version: "3.11"
          cache-suffix: test-${{ matrix.working-directory }}
          working-directory: ${{ matrix.working-directory }}

      - name: "📦 Install Test Dependencies"
        shell: bash
        run: uv sync --group test --dev

      - name: "🧪 Run Core Unit Tests"
        shell: bash
        run: |
          make test

      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  # Test compatibility with different Pydantic versions for affected packages
  # Inlined from _test_pydantic.yml: the fork dispatcher requires timeout-minutes, which reusable-workflow callers cannot set.
  test-pydantic:
    name: cd ${{ matrix.job-configs.working-directory }}
    needs: [build]
    if: ${{ needs.build.outputs.test-pydantic != '[]' }}
    strategy:
      matrix:
        job-configs: ${{ fromJson(needs.build.outputs.test-pydantic) }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.job-configs.working-directory }}
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@v6

      - name: "🐍 Set up Python 3.12 + UV"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.12"
          cache-suffix: test-pydantic-${{ matrix.job-configs.working-directory }}
          working-directory: ${{ matrix.job-configs.working-directory }}

      - name: "📦 Install Test Dependencies"
        shell: bash
        run: uv sync --group test

      - name: "🔄 Install Specific Pydantic Version"
        shell: bash
        env:
          PYDANTIC_VERSION: ${{ matrix.job-configs.pydantic-version }}
        run: VIRTUAL_ENV=.venv uv pip install "pydantic~=$PYDANTIC_VERSION"

      - name: "🧪 Run Core Tests"
        shell: bash
        run: |
          make test

      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  # Verify integration tests compile without actually running them (faster feedback)
  # Inlined from _compile_integration_test.yml: the fork dispatcher requires timeout-minutes, which reusable-workflow callers cannot set.
  compile-integration-tests:
    name: "Compile Integration Tests"
    needs: [build]
    if: ${{ needs.build.outputs.dirs-to-test != '[]' }}
    strategy:
      matrix:
        working-directory: ${{ fromJson(needs.build.outputs.dirs-to-test) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # _compile_integration_test.yml sets only UV_FROZEN at workflow level (no UV_NO_SYNC);
    # override this workflow's UV_NO_SYNC to preserve the reusable workflow's behaviour.
    env:
      UV_NO_SYNC: "false"
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: "🐍 Set up Python 3.11 + UV"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.11"
          cache-suffix: compile-integration-tests-${{ matrix.working-directory }}
          working-directory: ${{ matrix.working-directory }}

      - name: "📦 Install Integration Dependencies"
        shell: bash
        run: uv sync --group test --group test_integration

      - name: "🔗 Check Integration Tests Compile"
        shell: bash
        run: uv run pytest -m compile tests/integration_tests

      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  # Run extended test suites that require additional dependencies
  extended-tests:
    name: "Extended Tests"
    needs: [build]
    if: ${{ needs.build.outputs.extended-tests != '[]' }}
    strategy:
      matrix:
        # note different variable for extended test dirs
        job-configs: ${{ fromJson(needs.build.outputs.extended-tests) }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.job-configs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: "🐍 Set up Python ${{ matrix.job-configs.python-version }} + UV"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ matrix.job-configs.python-version }}
          cache-suffix: extended-tests-${{ matrix.job-configs.working-directory }}
          working-directory: ${{ matrix.job-configs.working-directory }}

      - name: "📦 Install Dependencies & Run Extended Tests"
        shell: bash
        run: |
          echo "Running extended tests, installing dependencies with uv..."
          uv venv
          uv sync --group test
          VIRTUAL_ENV=.venv uv pip install -r extended_testing_deps.txt
          VIRTUAL_ENV=.venv make extended_tests

      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  # Final status check - ensures all required jobs passed before allowing merge
  ci_success:
    name: "✅ CI Success"
    needs:
      [
        build,
        lint,
        test,
        test-pydantic,
        compile-integration-tests,
        extended-tests,
      ]
    if: |
      always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBS_JSON: ${{ toJSON(needs) }}
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
      EXIT_CODE: ${{!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && '0' || '1'}}
    steps:
      - name: "🎉 All Checks Passed"
        run: |
          echo $JOBS_JSON
          echo $RESULTS_JSON
          echo "Exiting with $EXIT_CODE"
          exit $EXIT_CODE
